name: Server

on:
  push:
    paths:
      - 'server/**'
      - '.github/workflows/server.yml'
  pull_request:
    paths:
      - 'server/**'
      - '.github/workflows/server.yml'

env:
  DATABASE_URL: postgresql://restodash:test@localhost:5432/restodash_test?schema=public
  TEST_DATABASE_URL: postgresql://restodash:test@localhost:5432/restodash_test?schema=public
  SESSION_SECRET: ci-session-secret-0123456789abcdefghijklmn
  PIN_PEPPER: ci-pin-pepper-0123456789abcdefghijklmn
  SWAGGER_ENABLED: 'false'

jobs:
  server:
    name: Lint, test, e2e, build
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: restodash
          POSTGRES_PASSWORD: test
          POSTGRES_DB: restodash_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U restodash -d restodash_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        working-directory: server
        run: npm ci

      - name: Generate Prisma client
        working-directory: server
        run: npx prisma generate

      - name: Apply migrations
        working-directory: server
        run: npx prisma migrate deploy

      - name: Lint
        working-directory: server
        run: npm run lint

      - name: Unit tests
        working-directory: server
        run: npm test

      - name: End-to-end tests
        working-directory: server
        run: npm run test:e2e

      - name: Build
        working-directory: server
        run: npm run build
